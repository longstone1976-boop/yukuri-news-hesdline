# Render の Blueprint（Webサービス＋PostgreSQL）
# まずは無料プランで試す設定。有料にする場合は plan を変更してください。
services:
  - type: web
    name: yukkuri-news
    runtime: node
    plan: free             # 無料プラン（しばらくアクセスがないと停止します）
    rootDir: server        # このリポジトリの server フォルダで動かす
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: yukkuri-news-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false          # デプロイ時に画面で入力（ファイルには書かない）
      - key: APP_PASSWORD
        sync: false          # 管理者画面（/admin）のパスワード（12文字以上）
      - key: APP_USER
        value: admin         # 管理者画面のユーザー名
      - key: SESSION_SECRET
        generateValue: true  # ログイン状態の署名用（Render が自動で作る）
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: ENABLE_SCHEDULER
        value: "true"

databases:
  - name: yukkuri-news-db
    databaseName: yukkuri_news
    plan: free             # 無料プラン（利用期限あり）
